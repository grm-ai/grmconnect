# Nginx reverse proxy for the LeadPilot backend on EC2.
# Install: sudo cp nginx.conf /etc/nginx/sites-available/leadpilot
#          sudo ln -s /etc/nginx/sites-available/leadpilot /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOY.md) — it rewrites this file in place to add the
# SSL server block, so this starting version is HTTP-only.

server {
    listen 80;
    server_name api.grmconnect.com;   # ← replace with your actual backend subdomain

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /due, campaign actions, AI generation can run long — don't cut them off.
        proxy_read_timeout 120s;
    }
}
